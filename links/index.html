     Die Zielseiten sind indexiert und tragen den Inhalt. -->

<style>
  /* Link-Seite (Instagram-Bio) nach dem Linktree-Muster: Profil, EIN
     hervorgehobener Weg, vier Knöpfe. Tiefe entsteht aus drei Lagen:
     Aurora-Grund (s2s.css) · Wellen-Video der Website · Glas darüber.
     Das Handy auf der Hauptkarte ist ein eigenes Higgsfield-Motiv
     (29.09.2026) — bewusst OHNE Zahlen: die Regler-Werte der Website
     sind illustrativ und im Register für Instagram gesperrt. */
  :root{
    --col:26.5rem;
    --glas:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
    --glas-rand:rgba(255,255,255,.12);
    --glas-tiefe:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.35),0 18px 40px -22px rgba(0,0,0,.8);
    --focus:0 0 0 2px #03080D,0 0 0 4px var(--emerald-soft);
  }
  body{font-size:16px;min-height:100svh}
  .welle{position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;opacity:.55;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.welle{display:none}}
  .blatt{position:relative;z-index:2;width:min(100%,var(--col));margin-inline:auto;
    padding:calc(env(safe-area-inset-top,0px) + 44px) 18px calc(env(safe-area-inset-bottom,0px) + 28px)}

  /* ===== Profil ===== */
  .profil{display:grid;justify-items:center;text-align:center}
  /* Story-Ring wie in der App — dreht sich langsam */
  .ring{position:relative;width:104px;height:104px;border-radius:50%;padding:3px;display:grid;place-items:center;isolation:isolate}
  .ring::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:-1;
    background:conic-gradient(from var(--w,0deg),#1FC998,#46BEEA,#1FA6E0,#0E6B55,#1FC998)}
  .ring img{width:100%;height:100%;border-radius:50%;border:3px solid #03080D;display:block}
  @property --w{syntax:"<angle>";inherits:false;initial-value:0deg}
  @media (prefers-reduced-motion:no-preference){.ring::before{animation:drehen 8s linear infinite}}
  @keyframes drehen{to{--w:360deg}}
  .profil h1{margin-top:14px;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:19px;font-weight:700;letter-spacing:.01em}
  .profil p{margin-top:4px;color:var(--muted);font-size:15px;line-height:1.45}
  .profil p em{font-family:"Fraunces",Georgia,serif;font-style:italic;color:var(--paper)}

  /* ===== Der Hauptweg ===== */
  .haupt{position:relative;display:grid;grid-template-columns:44% 1fr;align-items:end;margin-top:56px;
    border-radius:24px;text-decoration:none;color:inherit;isolation:isolate;
    background:radial-gradient(120% 90% at 0% 100%,rgba(0,184,136,.30),transparent 60%),linear-gradient(160deg,rgba(18,44,40,.92),rgba(6,16,20,.94));
    box-shadow:var(--glas-tiefe),0 34px 70px -34px rgba(0,184,136,.55);
    transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
  /* umlaufende Lichtkante */
  .haupt::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;z-index:-1;
    background:conic-gradient(from var(--w,0deg),rgba(31,201,152,.95),rgba(70,190,234,.2) 30%,rgba(255,255,255,.08) 55%,rgba(70,190,234,.6) 80%,rgba(31,201,152,.95));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  @media (prefers-reduced-motion:no-preference){.haupt::before{animation:drehen 6s linear infinite}}
  /* das Handy ragt aus der Karte heraus */
  .haupt__bild{position:relative;align-self:stretch;min-height:190px}
  /* Das Motiv stand auf reinem Schwarz — das Schwarz ist in der Datei als
     Transparenz herausgerechnet (Unscreen), damit das Handy auch ÜBER den
     Kartenrand ragen kann. `screen` allein wirkte nur innerhalb der Karte. */
  .haupt__bild img{position:absolute;left:-4%;bottom:6px;width:112%;height:auto;aspect-ratio:4/5;object-fit:cover;
    transform:translateY(-10%) rotate(-4deg);transition:transform .6s var(--ease)}
  .haupt__text{padding:22px 18px 20px 4px}
  .marke{font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--emerald-soft)}
  .haupt h2{margin:8px 0 14px;font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:25px;line-height:1.06;letter-spacing:-.01em}
  .haupt h2 em{font-style:italic;background:var(--accent-flow);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .los{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;font-size:15px;
    color:var(--emerald-ink);background:linear-gradient(135deg,#1FC998,#46BEEA);
    box-shadow:0 10px 26px -10px rgba(0,184,136,.7),inset 0 1px 0 rgba(255,255,255,.45)}
  .los span{transition:transform .4s var(--ease)}
  .haupt:hover{transform:translateY(-3px)}
  .haupt:hover .haupt__bild img{transform:translateY(-13%) rotate(-2deg)}
  .haupt:hover .los span{transform:translateX(3px)}
  .haupt:active{transform:translateY(0) scale(.99)}
  .haupt:focus-visible{outline:none;box-shadow:var(--focus),var(--glas-tiefe)}

  /* ===== Knöpfe ===== */
  .knoepfe{list-style:none;display:grid;gap:12px;margin-top:16px}
  .knopf{position:relative;display:flex;align-items:center;justify-content:center;min-height:60px;padding:0 56px;border-radius:18px;
    text-decoration:none;color:var(--paper);font-weight:650;font-size:16px;text-align:center;
    background:var(--glas);border:1px solid var(--glas-rand);box-shadow:var(--glas-tiefe);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
    transition:transform .35s var(--ease),background .35s var(--ease),border-color .35s var(--ease)}
  .knopf .ic{position:absolute;left:10px;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(160deg,rgba(31,201,152,.22),rgba(31,166,224,.10));box-shadow:inset 0 0 0 1px rgba(31,201,152,.25);color:var(--emerald-soft)}
  .knopf .ic svg{width:20px;height:20px}
  .knopf .gesichter{position:absolute;left:10px;top:50%;margin-top:-18px;display:flex}
  .knopf .gesichter img{width:36px;height:36px;border-radius:50%;border:2px solid #0b1716;object-fit:cover;display:block}
  .knopf .gesichter img+img{margin-left:-10px}
  .knopf .pfeil{position:absolute;right:18px;color:var(--faint);transition:transform .35s var(--ease),color .35s var(--ease)}
  .knopf:hover{transform:translateY(-2px);background:linear-gradient(180deg,rgba(31,201,152,.12),rgba(255,255,255,.04));border-color:rgba(31,201,152,.4)}
  .knopf:hover .pfeil{transform:translateX(3px);color:var(--emerald-soft)}
  .knopf:active{transform:scale(.985)}
  .knopf:focus-visible{outline:none;box-shadow:var(--focus)}

  .fuss{margin-top:36px;display:flex;flex-wrap:wrap;justify-content:center;gap:0 18px;font-size:13px}
  .fuss a{color:var(--faint);text-decoration:none;padding:12px 2px;min-height:44px;display:inline-flex;align-items:center}
  .fuss a:hover{color:var(--paper)}
  .fuss a:focus-visible{outline:2px solid var(--emerald-soft);outline-offset:2px;border-radius:4px}

  @media (prefers-reduced-motion:no-preference){
    .auf{animation:auf .9s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
  }
  @keyframes auf{from{opacity:0;transform:translateY(12px)}}
</style>
</head>
<body>
<video class="welle" autoplay muted loop playsinline preload="metadata" src="/assets/ambient-soft.mp4" aria-hidden="true"></video>
<main class="blatt">

    <h1>@social2scale</h1>

  <a class="haupt auf" style="--i:1" href="/gratis/" data-ziel="gratis">

      Preise<span class="pfeil" aria-hidden="true">→</span></a></li>
    <li class="auf" style="--i:4"><a class="knopf" href="/results/" data-ziel="results">

      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5c2.5-1.3 5-1.3 7.5 0v14c-2.5-1.3-5-1.3-7.5 0v-14Z"/><path d="M12 5.5c2.5-1.3 5-1.3 7.5 0v14c-2.5-1.3-5-1.3-7.5 0"/></svg></span>
      Ehrliche Antworten<span class="pfeil" aria-hidden="true">→</span></a></li>
  </ul>

  <footer class="fuss">
    <a href="/">social2scale.com</a>
    <a href="/impressum/">Impressum</a>
    <a href="/datenschutz/">Datenschutz</a>
  </footer>
</main>
<script>
  // Seitenaufruf + Klickziel zählen — eigene, cookie-freie Messung (landet im CRM).
  // Gesendet werden NUR: Pfad, Host der verweisenden Seite, Geräteklasse.
  // Der Klick zählt als /links/klick/<ziel>/, weil der Folgeaufruf auf der
  // Zielseite nur "intern" als Quelle kennt. Fehler bleiben stumm.
  (function () {
    var url = "https://closing.social2scale.com/api/pv";
    function senden(pfad, quelle) {
      try {
        if (navigator.doNotTrack === "1" || window.doNotTrack === "1") return;
        var daten = JSON.stringify({ p: pfad, r: quelle, d: matchMedia("(max-width:759px)").matches ? "mobil" : "desktop" });
        if (navigator.sendBeacon) navigator.sendBeacon(url, new Blob([daten], { type: "text/plain;charset=UTF-8" }));
        else fetch(url, { method: "POST", body: daten, headers: { "Content-Type": "text/plain;charset=UTF-8" }, keepalive: true }).catch(function () {});
      } catch (e) { /* Statistik darf die Seite nie stören */ }
    }
    var quelle = document.referrer || "";
    senden(location.pathname, quelle);
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a[data-ziel]");
      if (a) senden("/links/klick/" + a.getAttribute("data-ziel") + "/", quelle);
    });
  })();
</script>
