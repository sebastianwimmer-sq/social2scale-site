<!-- Link-Seite aus der Instagram-Bio: kein eigener Suchinhalt, deshalb noindex.
     Die Zielseiten sind indexiert und tragen den Inhalt. -->
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#03080D">
<title>social2scale — Links</title>
<meta name="description" content="Gratis-Vorschau, Erstgespräch, Preise und Antworten von social2scale.">
<link rel="canonical" href="https://social2scale.com/links/">
<link rel="preload" href="/links/img/vorschau-0.webp" as="image" fetchpriority="high">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/s2s.css">
<style>
  /* Link-Seite (Instagram-Bio): Profil, EIN Hauptweg, eine Menütafel.
     Die zwei Handys sind ECHTE Ausgabe des Vorschau-Werkzeugs (free-content,
     buildPage + buildFallback, Farbwelt "warm") für eine erfundene Person —
     so sieht der Besucher, was er in 60 Sekunden bekommt, statt eines
     Symbolbilds. Rechts in der Tafel stehen belegte Fakten der Zielseite
     (7 Pakete auf /preise/, 3 Kennzahlen auf /results/, 5 Artikel in /wissen/). */
  :root{
    --col:26rem;
    --kante:rgba(242,243,241,.10);
    --focus:0 0 0 2px #03080D,0 0 0 4px var(--emerald-soft);
  }
  body{font-size:16px;min-height:100svh}
  .blatt{position:relative;z-index:2;width:min(100%,var(--col));margin-inline:auto;
    padding:calc(env(safe-area-inset-top,0px) + 40px) 18px calc(env(safe-area-inset-bottom,0px) + 26px)}

  /* ===== Profil ===== */
  .profil{display:flex;align-items:center;gap:14px}
  .profil img{width:62px;height:62px;border-radius:50%;flex:0 0 auto;display:block;
    box-shadow:0 0 0 2px #03080D,0 0 0 3.5px rgba(31,201,152,.75),0 10px 24px -8px rgba(0,184,136,.45)}
  .profil b{display:block;font-size:17px;font-weight:700;letter-spacing:.005em}
  .profil span{display:block;font-size:14px;color:var(--muted);line-height:1.35}

  /* ===== Hauptweg ===== */
  .haupt{position:relative;display:block;border-radius:26px;text-decoration:none;color:inherit;isolation:isolate;
    padding:0 22px 22px;margin-top:64px;overflow:visible;
    background:
      radial-gradient(90% 70% at 100% 0%,rgba(31,166,224,.22),transparent 60%),
      radial-gradient(90% 80% at 0% 100%,rgba(0,184,136,.26),transparent 62%),
      linear-gradient(165deg,#12201F,#081013 70%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(31,201,152,.28),0 40px 80px -40px rgba(0,184,136,.6),0 20px 40px -24px rgba(0,0,0,.8);
    transition:transform .6s var(--ease),box-shadow .6s var(--ease)}
  .haupt__text{position:relative;z-index:2;display:block}
  .marke{display:inline-flex;align-items:center;gap:8px;font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:var(--emerald-soft)}
  .marke::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--emerald-soft);box-shadow:0 0 0 4px rgba(31,201,152,.18)}
  .haupt h1{margin:12px 0 8px;font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(30px,8.6vw,36px);line-height:.98;letter-spacing:-.02em}
  .haupt h1 em{font-style:italic;background:var(--accent-flow);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .haupt p{font-size:14px;color:var(--muted);line-height:1.4}
  /* zwei echte Vorschauen, aufgefächert — sie ragen über den Kartenrand */
  /* Handys oben, über den Kartenrand hinaus — Text und Knopf darunter,
     nichts überdeckt sich */
  .geraete{position:relative;display:block;height:clamp(150px,44vw,178px);margin:-44px -22px 16px;z-index:1;pointer-events:none;
    /* die Handys steigen aus der Karte auf: unten ausgeblendet statt abgeschnitten */
    -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 62%,transparent 100%)}
  .geraete img{position:absolute;top:0;left:50%;height:clamp(180px,54vw,216px);width:auto;border-radius:18px;
    filter:drop-shadow(0 22px 26px rgba(0,0,0,.55)) drop-shadow(0 2px 4px rgba(0,0,0,.4));
    transition:transform .7s var(--ease)}
  .geraete .hinten{margin-left:clamp(-128px,-31vw,-100px);transform:rotate(-8deg) translateY(10px)}
  .geraete .vorn{margin-left:-14px;transform:rotate(5deg)}
  .los{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;margin-top:20px;min-height:54px;padding:0 8px 0 22px;
    border-radius:999px;font-weight:700;font-size:16px;color:var(--emerald-ink);
    background:linear-gradient(135deg,#1FC998,#46BEEA);box-shadow:0 14px 30px -12px rgba(0,184,136,.75),inset 0 1px 0 rgba(255,255,255,.45)}
  .los i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#04201A;color:#7FF0CB;font-style:normal;
    transition:transform .45s var(--ease)}
  .haupt:hover{transform:translateY(-3px)}
  .haupt:hover .hinten{transform:rotate(-11deg) translate(-8px,6px)}
  .haupt:hover .vorn{transform:rotate(7deg) translate(6px,-6px)}
  .haupt:hover .los i{transform:translateX(3px)}
  .haupt:active{transform:scale(.99)}
  .haupt:focus-visible{outline:none;box-shadow:var(--focus)}

  /* ===== Menütafel ===== */
  .tafel{list-style:none;margin-top:16px;border-radius:22px;overflow:hidden;
    background:linear-gradient(170deg,rgba(20,34,35,.96),rgba(9,16,19,.96));box-shadow:var(--depth-lg);border:1px solid var(--kante)}
  .tafel li+li{border-top:1px solid var(--kante)}
  .zeile{display:grid;grid-template-columns:minmax(0,1fr) auto 22px;align-items:center;gap:12px;min-height:64px;padding:10px 16px 10px 20px;
    text-decoration:none;color:var(--paper);transition:background .35s var(--ease)}
  .zeile b{font-size:16.5px;font-weight:650;display:flex;align-items:center;gap:12px}
  .fakt{font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .zeile svg{width:22px;height:22px;color:var(--faint);transition:transform .35s var(--ease),color .35s var(--ease)}
  .gesichter{display:flex}
  .gesichter img{width:30px;height:30px;border-radius:50%;border:2px solid #111c1d;object-fit:cover;display:block}
  .gesichter img+img{margin-left:-9px}
  .zeile:hover{background:linear-gradient(90deg,rgba(0,184,136,.10),rgba(0,184,136,0))}
  .zeile:hover svg{transform:translateX(3px);color:var(--emerald-soft)}
  .zeile:hover .fakt{color:var(--muted)}
  .zeile:active{background:rgba(0,184,136,.14)}
  .zeile:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--emerald-soft)}

  @media (max-width:360px){.fakt{display:none}}
  .fuss{margin-top:30px;display:flex;flex-wrap:wrap;justify-content:center;gap:0 18px;font-size:13px}
  .fuss a{color:var(--faint);text-decoration:none;padding:12px 2px;min-height:44px;display:inline-flex;align-items:center}
  .fuss a:hover{color:var(--paper)}
  .fuss a:focus-visible{outline:2px solid var(--emerald-soft);outline-offset:2px;border-radius:4px}

  @media (prefers-reduced-motion:no-preference){
    .auf{animation:auf .9s var(--ease) both;animation-delay:calc(var(--i,0) * 80ms)}
    .geraete .vorn{animation:vorn 1.1s var(--ease) .15s both}
    .geraete .hinten{animation:hinten 1.1s var(--ease) .25s both}
  }
  @keyframes auf{from{opacity:0;transform:translateY(12px)}}
  @keyframes vorn{from{opacity:0;transform:rotate(0) translateY(24px)}}
  @keyframes hinten{from{opacity:0;transform:rotate(0) translateY(30px)}}
</style>
</head>
<body>
<main class="blatt">
  <header class="profil auf">
    <img src="/links/img/profil.webp" alt="social2scale" width="256" height="256">
    <span><b>@social2scale</b><span>Instagram für Coaches, Experten &amp; B2B</span></span>
  </header>

  <a class="haupt auf" style="--i:1" href="/gratis/" data-ziel="gratis">
    <span class="geraete" aria-hidden="true">
      <img class="hinten" src="/links/img/vorschau-1.webp" alt="" width="320" height="640">
      <img class="vorn" src="/links/img/vorschau-0.webp" alt="" width="322" height="640">
    </span>
    <span class="haupt__text">
      <span class="marke">Gratis · 60 Sek.</span>
      <h1>Dein Feed, <em>vorab.</em></h1>
      <p>Mit deinem Foto und deiner Farbe.</p>
    </span>
    <span class="los">Vorschau starten <i aria-hidden="true">→</i></span>
  </a>

  <ul class="tafel auf" style="--i:2">
    <li><a class="zeile" href="/anfrage/?von=bio" data-ziel="anfrage">
      <b><span class="gesichter" aria-hidden="true"><img src="/assets/founder-sebastian-avatar-192.webp" alt="" width="192" height="192"><img src="/assets/founder-philipp-avatar-192.webp" alt="" width="192" height="192"></span>Erstgespräch</b>
      <span class="fakt">kostenlos</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5"/></svg></a></li>
    <li><a class="zeile" href="/preise/" data-ziel="preise">
      <b>Preise</b><span class="fakt">7 Pakete</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5"/></svg></a></li>
    <li><a class="zeile" href="/results/" data-ziel="results">
      <b>Prüf uns</b><span class="fakt">3 Kennzahlen</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5"/></svg></a></li>
    <li><a class="zeile" href="/wissen/" data-ziel="wissen">
      <b>Ehrliche Antworten</b><span class="fakt">5 Fragen</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5"/></svg></a></li>
  </ul>

  <footer class="fuss">
    <a href="/">social2scale.com</a>
    <a href="/impressum/">Impressum</a>
    <a href="/datenschutz/">Datenschutz</a>
  </footer>
</main>
<script>
  // Seitenaufruf + Klickziel zählen — eigene, cookie-freie Messung (landet im CRM).
  // Gesendet werden NUR: Pfad, Host der verweisenden Seite, Geräteklasse.
  // Der Klick zählt als /links/klick/<ziel>/, weil der Folgeaufruf auf der
  // Zielseite nur "intern" als Quelle kennt. Fehler bleiben stumm.
  (function () {
    var url = "https://closing.social2scale.com/api/pv";
    function senden(pfad, quelle) {
      try {
        if (navigator.doNotTrack === "1" || window.doNotTrack === "1") return;
        var daten = JSON.stringify({ p: pfad, r: quelle, d: matchMedia("(max-width:759px)").matches ? "mobil" : "desktop" });
        if (navigator.sendBeacon) navigator.sendBeacon(url, new Blob([daten], { type: "text/plain;charset=UTF-8" }));
        else fetch(url, { method: "POST", body: daten, headers: { "Content-Type": "text/plain;charset=UTF-8" }, keepalive: true }).catch(function () {});
      } catch (e) { /* Statistik darf die Seite nie stören */ }
    }
    var quelle = document.referrer || "";
    senden(location.pathname, quelle);
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a[data-ziel]");
      if (a) senden("/links/klick/" + a.getAttribute("data-ziel") + "/", quelle);
    });
  })();
</script>
</body>
</html>
