<!-- Sofort-Weiterleitung zum Funnel. Marken-Link fuer die Instagram-Bio.
     WICHTIG: die Funnel-Adresse steht hier an GENAU EINER Stelle (dreimal:
     meta-refresh, JS, sichtbarer Fallback-Knopf) — bei Domain-/URL-Wechsel
     nur in dieser Datei anpassen. -->
<meta http-equiv="refresh" content="0; url=https://start.social2scale.com/">

<title>Gratis-Vorschau — social2scale</title>
<meta name="description" content="Drei Fragen, Mail bestätigen — und du siehst eine Vorschau, wie dein Instagram-Auftritt aussehen könnte. Kostenlos, ohne Gespräch.">

<meta name="twitter:description" content="Drei Fragen, Mail bestätigen — und du siehst deine Instagram-Vorschau. Kostenlos, ohne Gespräch.">
<meta name="twitter:image" content="https://social2scale.com/assets/og-image.png">

<!-- Die Schriften der Marke. Ohne diese Zeile faellt die Seite auf die
     Systemschrift zurueck und sieht aus wie eine fremde Website — genau das
     war der Zustand vor dem 28.07.2026. -->
<link rel="stylesheet" href="/fonts.css">
<style>
  /* Tokens 1:1 aus index.html — damit diese Seite nicht eigene Farben erfindet. */
  :root{
    --ink:#03080D; --paper:#F2F3F1; --muted:#A4A6A1; --faint:#7C7E78;
    --emerald:#00B888; --emerald-soft:#1FC998; --teal:#1FA6E0;
    --accent-flow:linear-gradient(135deg,#1FC998,#46BEEA);
    --line-2:rgba(242,243,241,.14); --line-3:rgba(242,243,241,.20);
    --ease:cubic-bezier(.16,1,.3,1);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  ::selection{background:rgba(0,184,136,.30);color:var(--paper)}

  /* Aurora-Doppelton wie auf der Startseite: Emerald oben links, Teal unten
     rechts, ueber dunkler Diagonale. Vorher lag hier ein einzelner flacher
     Radial-Verlauf — der Grund, warum die Seite "billig" wirkte. */
  /* Atmosphaere statt leerer Flaeche: unter dem Aurora-Doppelton liegt jetzt
     dasselbe Arbeitsplatz-Foto wie auf der Preisseite, stark abgedunkelt. Auf
     grossen Bildschirmen stand die Karte vorher in einem leeren Raum. */
  body{
    min-height:100dvh;
    background:
      radial-gradient(120% 90% at 12% -10%, rgba(0,184,136,.18), transparent 58%),
      radial-gradient(110% 90% at 88% 108%, rgba(31,166,224,.14), transparent 60%),
      linear-gradient(165deg,rgba(10,17,20,.90) 0%,rgba(3,8,13,.94) 62%),
      url(/assets/workspace.webp) center/cover no-repeat,
      var(--ink);
    color:var(--paper);
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid;place-items:center;padding:clamp(24px,6vw,56px);text-align:center;
  }

  .card{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(18px,2.4vw,26px);max-width:34rem;
    padding:clamp(28px,5vw,48px) clamp(24px,4vw,44px);
    border:1px solid rgba(242,243,241,.10);border-radius:20px;
    background:linear-gradient(180deg,rgba(20,21,24,.62),rgba(10,11,13,.50));
    -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 40px 90px -50px rgba(0,0,0,.9)}
  .wordmark{height:28px;width:auto;mix-blend-mode:screen}

  .klabel{
    font-family:"Archivo",sans-serif;font-size:11px;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  }

  h1{
    font-family:"Fraunces",serif;font-weight:400;
    font-size:clamp(2.1rem,1.3rem + 2.8vw,3.2rem);line-height:1.04;letter-spacing:-.025em;
    font-variation-settings:"opsz" 144;
    /* Umbruch erzwingen: einzeilig wirkt die Zeile klein, gestapelt entspricht
       sie der Editorial-Typografie der uebrigen Seiten. */
    max-width:15ch;
    text-shadow:0 1px 0 rgba(255,255,255,.04),0 14px 34px rgba(0,0,0,.45);
  }
  h1 em{
    font-style:italic;font-weight:400;
    background:var(--accent-flow);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:var(--emerald);
  }

  p.lead{color:var(--muted);font-size:1.02rem;line-height:1.55;max-width:38ch}

  /* Fortschritt als laufendes Licht statt rotierendem Kreis — dieselbe
     Bildsprache wie der Build-Screen im Funnel. Nur transform, damit es
     auf dem Compositor laeuft. */
  .load{width:min(260px,64vw);height:2px;border-radius:2px;background:var(--line-2);overflow:hidden}
  .load span{display:block;height:100%;width:38%;border-radius:2px;background:var(--accent-flow);animation:rutsch 1.4s var(--ease) infinite}
  @keyframes rutsch{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}

  /* Rahmen-Knopf wie in der Gratis-Sektion der Startseite. Bewusst KEIN
     Emerald-Leuchten: das bleibt dem Erstgespraech-CTA vorbehalten. */
  .btn{
    display:inline-block;font-family:"Archivo",sans-serif;font-size:14.5px;font-weight:700;
    letter-spacing:.02em;padding:16px 30px;border-radius:9px;text-decoration:none;
    background:transparent;color:var(--paper);border:1px solid var(--line-3);
    transition:border-color .25s var(--ease),background .25s var(--ease),transform .25s var(--ease);
  }
  .btn:hover,.btn:focus-visible{border-color:rgba(0,184,136,.55);background:rgba(0,184,136,.09);transform:translateY(-2px);outline:none}

  .fine{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--faint);line-height:1.8}

  @media (prefers-reduced-motion:reduce){
    .load span{animation:none;width:100%}
    .btn:hover,.btn:focus-visible{transform:none}
  }
</style>
</head>
<body>
  <main class="card">
    <img class="wordmark" src="/assets/sig-wordmark.png" alt="social2scale" width="180" height="28">
    <p class="klabel">Kostenlos · ohne Gespräch</p>
    <h1>Deine Vorschau wird <em>geöffnet</em>.</h1>
    <p class="lead">Einen Moment — wir bringen dich hin. Falls nichts passiert, geht es auch von Hand:</p>
    <div class="load" role="status" aria-label="Weiterleitung läuft"><span></span></div>
    <a class="btn" href="https://start.social2scale.com/">Vorschau jetzt starten →</a>
    <p class="fine">Drei Fragen beantworten · Mail bestätigen · Vorschau ansehen</p>
  </main>
  <script>
    // replace() statt href: kein Eintrag in der Historie, der Zurueck-Knopf
    // fuehrt zurueck zu Instagram und nicht in eine Weiterleitungsschleife.
    location.replace("https://start.social2scale.com/");
  </script>
<script>
  // Seitenaufruf zählen — eigene, cookie-freie Messung (landet direkt im CRM).
  // Gesendet werden NUR: Pfad, Host der verweisenden Seite, Geräteklasse.
  // Keine Cookies, keine Kennung, keine IP-Speicherung — deshalb braucht die
  // Seite weiterhin keinen Cookie-Banner. Fehler bleiben stumm.
  (function () {
    try {
      if (navigator.doNotTrack === "1" || window.doNotTrack === "1") return;
      var daten = JSON.stringify({
        p: location.pathname,
        r: document.referrer || "",
        d: matchMedia("(max-width:759px)").matches ? "mobil" : "desktop"
      });
      var url = "https://closing.social2scale.com/api/pv";
      // sendBeacon überlebt auch schnelles Weiterklicken und blockiert nichts.
      if (navigator.sendBeacon) navigator.sendBeacon(url, new Blob([daten], { type: "application/json" }));
      else fetch(url, { method: "POST", body: daten, headers: { "Content-Type": "application/json" }, keepalive: true }).catch(function () {});
    } catch (e) { /* Statistik darf die Seite nie stören */ }
  })();
</script>
</body>
</html>
