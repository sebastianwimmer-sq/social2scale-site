<!-- Sofort-Weiterleitung zum Funnel. Marken-Link fuer die Instagram-Bio.
     WICHTIG: die Funnel-Adresse steht hier an GENAU EINER Stelle (dreimal:
     meta-refresh, JS, sichtbarer Fallback-Knopf) — bei Domain-/URL-Wechsel
     nur in dieser Datei anpassen. -->
<meta http-equiv="refresh" content="0; url=https://s2s-free-content.peaking.workers.dev/">

<title>Gratis-Vorschau — social2scale</title>
<meta name="description" content="Drei Fragen, Mail bestätigen — und du siehst eine Vorschau, wie dein Instagram-Auftritt aussehen könnte. Kostenlos, ohne Gespräch.">
<link rel="canonical" href="https://social2scale.com/gratis/">
<meta property="og:title" content="Deine Gratis-Vorschau — social2scale">
<meta property="og:description" content="Drei Fragen, Mail bestätigen — und du siehst eine Vorschau, wie dein Instagram-Auftritt aussehen könnte. Kostenlos, ohne Gespräch.">
<meta property="og:url" content="https://social2scale.com/gratis/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://social2scale.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="social2scale — Gratis-Vorschau deines Instagram-Auftritts">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Deine Gratis-Vorschau — social2scale">
<meta name="twitter:description" content="Drei Fragen, Mail bestätigen — und du siehst deine Instagram-Vorschau. Kostenlos, ohne Gespräch.">
<meta name="twitter:image" content="https://social2scale.com/assets/og-image.png">

<style>
  :root{
    --bg:#03080D; --surface:#0a1119; --text:#eaf2ef; --muted:#8fa3a0;
    --accent:#00B888; --accent-glow:rgba(0,184,136,.28); --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(0,184,136,.12), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:grid; place-items:center; min-height:100dvh; padding:2rem;
    text-align:center; -webkit-font-smoothing:antialiased;
  }
  .card{max-width:26rem; display:flex; flex-direction:column; align-items:center; gap:1.4rem}
  .wordmark{height:26px; width:auto; opacity:.95}
  h1{
    font-size:clamp(1.5rem,1.2rem+2vw,2.1rem); line-height:1.15; margin:0;
    letter-spacing:-.02em; font-weight:650;
  }
  h1 em{font-style:normal; color:var(--accent)}
  p{margin:0; color:var(--muted); font-size:1rem; line-height:1.5}
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:2.5px solid var(--line); border-top-color:var(--accent);
    animation:spin .8s linear infinite; box-shadow:0 0 22px var(--accent-glow);
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}}
  .go{
    display:inline-block; margin-top:.4rem; padding:.85rem 1.5rem;
    border:1px solid rgba(0,184,136,.5); border-radius:999px;
    color:var(--accent); text-decoration:none; font-weight:600; font-size:.95rem;
    transition:background .2s ease, border-color .2s ease;
  }
  .go:hover,.go:focus-visible{background:rgba(0,184,136,.1); border-color:var(--accent); outline:none}
  .fine{font-size:.82rem; color:rgba(143,163,160,.7)}
</style>
</head>
<body>
  <main class="card">
    <img class="wordmark" src="/assets/sig-wordmark.png" alt="social2scale" width="180" height="26">
    <div class="spinner" role="status" aria-label="Wird geladen"></div>
    <h1>Deine <em>Gratis-Vorschau</em> wird geöffnet …</h1>
    <p>Einen Moment — wir leiten dich weiter. Falls nichts passiert:</p>
    <a class="go" href="https://s2s-free-content.peaking.workers.dev/">Vorschau jetzt starten →</a>
    <p class="fine">Drei Fragen, Mail bestätigen — kostenlos, ohne Gespräch.</p>
  </main>
  <script>
    // Sauberer Redirect ohne History-Eintrag (Back-Button springt nicht hierher zurueck).
    location.replace("https://s2s-free-content.peaking.workers.dev/");
  </script>
</body>
</html>
