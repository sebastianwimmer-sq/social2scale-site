# ⚠️ TEST-ONLY Config — Kopie von wrangler.toml OHNE [[queues.consumers]].
# Bei Aenderungen an wrangler.toml (Bindings/Vars) HIER nachziehen. Grund für die
# fehlende Consumer-Sektion: siehe vitest.config.js.
name = "s2s-free-content"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOW_ORIGIN  = "https://social2scale.com"
NOTIFY_TO     = "info@social2scale.com"
NOTIFY_FROM   = "info@social2scale.com"
# TEMP fuer den privaten Test (21.07.): auf die workers.dev-URL, damit die Mail-Links
# erreichbar sind, OHNE die Domain anzufassen. Zurueck auf start.social2scale.com,
# sobald die branded Domain steht.
PUBLIC_ORIGIN = "https://s2s-free-content.peaking.workers.dev"
# claude-sonnet-5 hat beim ersten Live-Test die API-Antwort scheitern lassen ->
# generateCopy() fiel auf buildFallback (generische Copy). claude-sonnet-4-6 ist
# die im _portal-Worker seit Wochen bewaehrte, funktionierende ID (21.07.).
AI_MODEL      = "claude-sonnet-4-6"
# Public (kein Secret) — steht so im Formular-HTML. Bestaetigt am 19.07. beim
# Live-Gate von Plan 2 (Task 10).
TURNSTILE_SITE_KEY = "0x4AAAAAAD5FwCxWtZhzGlpX"

# Geteilt mit dem CRM — dieselbe DB, damit Leads in den CRM-Eingängen landen.
[[d1_databases]]
binding = "DB"
database_name = "s2s-crm"
database_id = "ddb630bc-a9c8-48ba-95bd-9c3843d0846e"

# Secrets via CLI (NICHT hier eintragen):
#   npx wrangler secret put BREVO_API_KEY
#   npx wrangler secret put TURNSTILE_SECRET

# Browser Rendering — am 15.07. auf diesem Account verifiziert (Wegwerf-Worker
# s2s-browser-probe: puppeteer.launch(env.BROWSER) -> echtes PNG zurueck).
[browser]
binding = "BROWSER"

# Generierte Bilder. Eigener Bucket, NICHT s2s-logos (das sind Kundinnen-Assets).
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "s2s-free"

# Generierung laeuft NICHT mehr im waitUntil des Confirm-Requests (dessen Grace-
# Fenster ~30s ist zu kurz fuer Claude-Copy + 20-Frame-Render → "waitUntil tasks
# cancelled", Lead blieb bei 'building' haengen). Stattdessen: Confirm legt EINE
# Queue-Nachricht ab (schnell), der Consumer generiert mit vollem Zeitbudget +
# Auto-Retry.
[[queues.producers]]
binding = "GEN_QUEUE"
queue = "s2s-free-gen"

